# Подключение JavaFX-приложения к базе данных из КР №1 (PostgreSQL, JDBC).
# Укажите фактические параметры своей базы.

# Вариант 1 (по умолчанию): локальный PostgreSQL, база из КР №1
db.url=jdbc:postgresql://localhost:5432/recording_studio?connectTimeout=5
db.user=postgres
db.password=1234

